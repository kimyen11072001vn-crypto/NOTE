version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: note_db
    environment:
      POSTGRES_USER: note_user
      POSTGRES_PASSWORD: note_password
      POSTGRES_DB: note_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U note_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: note_backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://note_user:note_password@db:5432/note_db
      JWT_SECRET: dev_secret_key_change_in_production
      CLIENT_URL: http://localhost:3000
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./packages/backend/src:/app/src
    command: npm run dev

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    container_name: note_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  default:
    name: note_network
